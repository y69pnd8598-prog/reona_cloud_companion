<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reona 雲端伴侶互動空間</title>
  <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: #11141c;
      color: #f3f5f8;
    }
    .wrap {
      max-width: 960px;
      margin: 0 auto;
      display: grid;
      gap: 14px;
    }
    .card {
      background: #1a1f2c;
      border: 1px solid #2c3448;
      border-radius: 12px;
      padding: 14px;
    }
    .stage {
      width: 100%;
      height: 460px;
      background: #11141c;
      border: 1px solid #262e40;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #live2d-canvas {
      width: 100%;
      height: 100%;
      display: none;
    }
    .stage-note {
      color: #9aa5bc;
      font-size: 13px;
      padding: 12px;
      text-align: center;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 8px;
    }
    button {
      padding: 9px 14px;
      border-radius: 8px;
      border: 1px solid #3c4763;
      background: #252d40;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { background: #313c54; }
    button.primary {
      background: #e85d88;
      border-color: #e85d88;
      font-weight: 600;
    }
    input[type="text"] {
      flex: 1;
      min-width: 200px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #3c4763;
      background: #11141c;
      color: #fff;
      font-size: 14px;
    }
    .chat-box {
      height: 300px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 10px;
      background: #11141c;
      border-radius: 8px;
      border: 1px solid #262e40;
    }
    .msg {
      max-width: 80%;
      padding: 9px 12px;
      border-radius: 10px;
      line-height: 1.5;
      font-size: 14px;
    }
    .msg.nick { align-self: flex-end; background: #e85d88; color: #fff; }
    .msg.reona { align-self: flex-start; background: #252d40; color: #f3f5f8; }
    .msg.tip { align-self: center; color: #9aa5bc; font-size: 12px; background: transparent; }
    .muted { color: #9aa5bc; font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="stage" id="stage">
        <canvas id="live2d-canvas"></canvas>
        <div class="stage-note" id="stage-note">尚未顯示角色模型（上傳含 .model3.json 的 ZIP 後會嘗試顯示在此）</div>
      </div>

      <div class="muted" id="status-text" style="margin-top:10px;">雪梨時間：讀取中｜狀態：讀取中</div>
      <div class="row">
        <input type="file" id="zip-file" accept=".zip" />
        <button type="button" id="upload-zip-btn">上傳角色 ZIP</button>
        <span class="muted" id="zip-result">尚未上傳角色 ZIP（不影響聊天）</span>
      </div>
      <div class="row">
        <button type="button" class="primary" id="proactive-auto-btn">讓她主動找我</button>
        <button type="button" id="proactive-inc-btn">模擬有狀況／吃壞肚子</button>
        <button type="button" id="proactive-chat-btn">分享生活瑣事</button>
        <button type="button" id="proactive-rec-btn">好轉報平安</button>
      </div>
    </div>

    <div class="card">
      <div class="chat-box" id="chat-box">
        <div class="msg tip">已就緒，可以直接輸入訊息或按上方按鈕互動</div>
      </div>
      <form class="row" id="chat-form">
        <input type="text" id="chat-input" placeholder="跟 Reona 說點什麼..." autocomplete="off" />
        <button type="submit" class="primary" id="send-btn">傳送</button>
      </form>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById("chat-box");
    const chatForm = document.getElementById("chat-form");
    const chatInput = document.getElementById("chat-input");
    const statusText = document.getElementById("status-text");
    const zipFile = document.getElementById("zip-file");
    const uploadZipBtn = document.getElementById("upload-zip-btn");
    const zipResult = document.getElementById("zip-result");
    const stage = document.getElementById("stage");
    const canvas = document.getElementById("live2d-canvas");
    const stageNote = document.getElementById("stage-note");

    let pixiApp = null;
    let currentModel = null;

    function addMsg(cls, text) {
      const lines = String(text || "").split("||").map(s => s.trim()).filter(Boolean);
      for (const line of lines) {
        const div = document.createElement("div");
        div.className = "msg " + cls;
        div.textContent = line;
        chatBox.appendChild(div);
      }
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function applyStatus(st) {
      if (!st) return;
      statusText.textContent = `雪梨時間：${st.sydney_time || "--"}｜狀態：${st.condition_label || "正常"}｜動態：${st.activity || ""}`;
    }

    function fitModelToStage() {
      if (!pixiApp || !currentModel) return;
      const w = stage.clientWidth || 900;
      const h = stage.clientHeight || 460;
      pixiApp.renderer.resize(w, h);
      const scale = Math.min(
        (w * 1.15) / Math.max(1, currentModel.width),
        (h * 1.25) / Math.max(1, currentModel.height)
      );
      currentModel.scale.set(scale);
      currentModel.anchor.set(0.5, 0.5);
      currentModel.x = w / 2;
      currentModel.y = h / 2 + 24;
    }

    async function renderModel(modelUrl) {
      if (!modelUrl) return;
      try {
        if (!window.PIXI || !PIXI.live2d || !PIXI.live2d.Live2DModel) {
          stageNote.textContent = "無法載入 Live2D 渲染庫，但已解壓完成且不影響聊天";
          return;
        }
        stageNote.style.display = "none";
        canvas.style.display = "block";
        if (!pixiApp) {
          pixiApp = new PIXI.Application({
            view: canvas,
            autoStart: true,
            transparent: true,
            width: stage.clientWidth || 900,
            height: stage.clientHeight || 460,
          });
        }
        if (currentModel) {
          pixiApp.stage.removeChild(currentModel);
          currentModel.destroy();
          currentModel = null;
        }
        const model = await PIXI.live2d.Live2DModel.from(modelUrl);
        currentModel = model;
        pixiApp.stage.addChild(model);
        fitModelToStage();
      } catch (err) {
        canvas.style.display = "none";
        stageNote.style.display = "block";
        stageNote.textContent = "模型畫面載入失敗（不影響聊天功能）";
      }
    }

    window.addEventListener("resize", fitModelToStage);

    async function refreshStatus() {
      try {
        const res = await fetch("/status");
        const data = await res.json();
        if (data.ok && data.status) {
          applyStatus(data.status);
          if (data.status.model_loaded && data.status.model_url) {
            await renderModel(data.status.model_url);
          }
        }
      } catch (e) {
        statusText.textContent = "狀態讀取失敗";
      }
    }

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = chatInput.value.trim();
      if (!text) return;
      chatInput.value = "";
      addMsg("nick", text);
      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        if (data.ok && data.reply) {
          addMsg("reona", data.reply);
          applyStatus(data.status);
        } else {
          addMsg("tip", data.error || "沒有收到回覆");
        }
      } catch (err) {
        addMsg("tip", "連線失敗：" + err.message);
      }
    });

    async function runProactive(mode) {
      try {
        const res = await fetch("/proactive", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ mode })
        });
        const data = await res.json();
        if (data.ok && data.reply) {
          addMsg("reona", data.reply);
          applyStatus(data.status);
        } else {
          addMsg("tip", data.error || "主動發訊失敗");
        }
      } catch (err) {
        addMsg("tip", "連線失敗：" + err.message);
      }
    }

    document.getElementById("proactive-auto-btn").addEventListener("click", () => runProactive("auto"));
    document.getElementById("proactive-inc-btn").addEventListener("click", () => runProactive("incident"));
    document.getElementById("proactive-chat-btn").addEventListener("click", () => runProactive("chit_chat"));
    document.getElementById("proactive-rec-btn").addEventListener("click", () => runProactive("recover"));

    uploadZipBtn.addEventListener("click", async () => {
      const file = zipFile.files && zipFile.files[0];
      if (!file) {
        zipResult.textContent = "請先選取一個 .zip 檔";
        return;
      }
      zipResult.textContent = "正在上傳並解壓...";
      const fd = new FormData();
      fd.append("file", file);
      try {
        const res = await fetch("/upload_model", { method: "POST", body: fd });
        const data = await res.json();
        if (data.ok && data.model_url) {
          zipResult.textContent = "已載入模型：" + (data.model_name || file.name);
          addMsg("tip", "角色 ZIP 已上傳並解壓完成");
          await renderModel(data.model_url);
        } else {
          zipResult.textContent = data.error || "ZIP 處理完成（無 .model3.json）";
        }
      } catch (err) {
        zipResult.textContent = "上傳失敗：" + err.message;
      }
    });

    refreshStatus();
  </script>
</body>
</html>
